# nginx.conf for the single container: keeps every writable location under
# /tmp so the container can run with read_only=true. Workers run as root,
# matching the single-container posture (supervisord and the bridges already
# run as root); a restricted uid would be locked out of the 1770 tmpfs.
user root;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    include /etc/nginx/conf.d/*.conf;
}